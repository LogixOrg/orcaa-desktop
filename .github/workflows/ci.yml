name: CI

# The release workflow only ever BUILDS — this is the gate that actually runs
# the crate's unit tests (window clamping, safe_target, PKCE sign-in, shell-page
# escaping, injected-script regression guards) plus clippy and rustfmt. Runs on
# every push/PR so a broken shared fix is caught before anyone tags a release.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  rust:
    name: fmt + clippy + test
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same system deps as the release build — tauri won't compile without the
      # Linux WebView (webkit2gtk) and the tray-icon stack.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libudev-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ci

      - name: rustfmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: tests
        working-directory: src-tauri
        run: cargo test
